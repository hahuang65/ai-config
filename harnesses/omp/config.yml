tools: 
  approvalMode: write
  approval: 
    bash: allow
    browser: prompt
    ssh: prompt
    eval: prompt
    web_search: allow
# Push-only sharing (ADR-0010): disable discovery of sibling harnesses' USER
# config roots (~/.claude, ~/.codex, ~/.pi) so oh-my-pi sees only what
# install.sh mirrors into ~/.omp/agent at native priority. Project-level
# discovery is left enabled — it is per-repo, not cross-harness pollution.
skills:
  enableClaudeUser: false
  enableCodexUser: false
  enablePiUser: false
commands:
  enableClaudeUser: false
  enableCodexUser: false
  enablePiUser: false
# Machine-specific settings (model, etc.) go directly into the installed copy at
# ~/.omp/agent/config.yml — edit it freely, install.sh won't overwrite it.
# Use ./install.sh --force to pull in the repo base again.
theme: 
  dark: dark-catppuccin
startup: 
  quiet: true
symbolPreset: nerd
