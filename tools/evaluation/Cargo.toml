[package]
name = "evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "evaluation"

[[bin]]
name = "review-change-eval"
path = "src/change_main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
signal-hook = "0.3"
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
hmac = "0.12"
rand = "0.9"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[workspace]
