[package]
name = "wt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent task worktrees with conservative cleanup"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
