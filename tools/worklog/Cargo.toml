[package]
name = "wl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"

[dev-dependencies]
tempfile = "3"
